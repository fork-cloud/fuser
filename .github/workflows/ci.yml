name: Fork patch checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RUSTFLAGS: --deny warnings

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust components
        run: rustup component add clippy rustfmt

      - name: Format
        run: cargo fmt --all --check

      - name: Check all targets
        run: cargo check --workspace --all-targets

      - name: Unit tests
        run: cargo test --workspace --lib -- --skip=mnt::test::mount_unmount

      - name: Clippy
        run: cargo clippy --package=fuser --all-targets -- --deny warnings
